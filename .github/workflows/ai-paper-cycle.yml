name: AI paper cycle
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "config.py"
      - "arena_bridge.py"
      - "ai/**"
      - "core/**"
      - "paper_trading.py"
      - "tests/test_ai_layer.py"
      - "tests/test_order_state_machine.py"
      - "tests/fixtures/ai_cycle_markets.json"
      - ".github/workflows/ai-paper-cycle.yml"
  pull_request:
    paths:
      - "main.py"
      - "config.py"
      - "arena_bridge.py"
      - "ai/**"
      - "core/**"
      - "paper_trading.py"
      - "tests/test_ai_layer.py"
      - "tests/test_order_state_machine.py"
      - "tests/fixtures/ai_cycle_markets.json"
      - ".github/workflows/ai-paper-cycle.yml"
permissions:
  contents: read
jobs:
  offline-paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AI_OFFLINE: "1"
      PAPER_MODE: "true"
      LIVE_MODE: "false"
      DATA_DIR: reports/ai-cycle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests for the decision layer
        run: python -m unittest tests.test_order_state_machine tests.test_ai_layer -v
      - name: Run one offline paper cycle
        run: |
          python main.py --once --markets-file tests/fixtures/ai_cycle_markets.json --data-dir reports/ai-cycle
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path("reports/ai-cycle/cycle_summary.json").read_text())
          assert summary["paper_mode"] is True
          assert summary["live_mode"] is False
          assert summary["live_submission_implemented"] is False
          assert summary["filled"] == 1
          assert summary["open_positions"] == 1
          assert Path("reports/ai-cycle/ai_decisions.csv").exists()
          assert Path("reports/ai-cycle/ai_decisions.jsonl").exists()
          assert Path("reports/ai-cycle/pnl_summary.csv").exists()
          print("Offline AI paper cycle passed.")
          PY
      - name: Upload paper-cycle logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-paper-cycle
          path: reports/ai-cycle
          if-no-files-found: error
          retention-days: 14
