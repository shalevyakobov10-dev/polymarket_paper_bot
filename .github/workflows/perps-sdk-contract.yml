name: Perps SDK contract

on:
  push:
    paths:
      - "requirements.txt"
      - "perps_sdk_contract.py"
      - "perps_sdk_reconciler.py"
      - "perps_account_preflight.py"
      - "perps_live_release_gate.py"
      - "perps_auto_cancel_guard.py"
      - "perps_live_execution_gateway.py"
      - "perps_auto_cancel_guard.py"
      - "perps_live_execution_gateway.py"
      - "tests/test_perps_sdk_contract.py"
      - "tests/test_perps_account_preflight.py"
      - "tests/test_perps_live_release_gate.py"
      - "tests/test_perps_auto_cancel_guard.py"
      - "tests/test_perps_live_execution_gateway.py"
      - "tests/test_perps_auto_cancel_guard.py"
      - "tests/test_perps_live_execution_gateway.py"
      - ".github/workflows/perps-sdk-contract.yml"
  pull_request:
    paths:
      - "requirements.txt"
      - "perps_sdk_contract.py"
      - "perps_sdk_reconciler.py"
      - "perps_account_preflight.py"
      - "perps_live_release_gate.py"
      - "perps_auto_cancel_guard.py"
      - "perps_live_execution_gateway.py"
      - "perps_auto_cancel_guard.py"
      - "perps_live_execution_gateway.py"
      - "tests/test_perps_sdk_contract.py"
      - "tests/test_perps_account_preflight.py"
      - "tests/test_perps_live_release_gate.py"
      - "tests/test_perps_auto_cancel_guard.py"
      - "tests/test_perps_live_execution_gateway.py"
      - "tests/test_perps_auto_cancel_guard.py"
      - "tests/test_perps_live_execution_gateway.py"
      - ".github/workflows/perps-sdk-contract.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install pinned runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify official Perps SDK contract (offline)
        run: python perps_sdk_contract.py
      - name: Run contract unit tests
        run: python -m unittest discover -s tests -p 'test_perps_sdk_contract.py' -v
      - name: Run complete Perps unit-test suite
        run: python -m unittest discover -s tests -p 'test_perps_*.py' -v
      - name: Run Perps account, order journal, gateway, and safety tests
        run: python -m unittest discover -s tests -p 'test_perps_*.py' -v
