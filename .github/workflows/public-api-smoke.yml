name: Public API smoke check
on:
  push:
    branches: [main, research/event-aware-news-signals]
    paths:
      - "app.py"
      - "market_data.py"
      - "live_market_snapshot_provider.py"
      - "requirements.txt"
      - ".github/workflows/public-api-smoke.yml"
  pull_request:
    branches: [main, research/live-execution-gateway, research/event-aware-news-signals]
    paths:
      - "app.py"
      - "market_data.py"
      - "live_market_snapshot_provider.py"
      - "requirements.txt"
      - ".github/workflows/public-api-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 7 * * *"
permissions:
  contents: read
jobs:
  public-gamma-clob-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only public market client
        run: python -m pip install -r requirements.txt
      - name: Validate public Gamma metadata and live CLOB order books
        env:
          PAPER_LIVE_MARKETS_LIMIT: "2"
          PAPER_GAMMA_PAGE_SIZE: "100"
          ORDERBOOK_TOKENS_PER_POLL: "4"
          ORDERBOOK_FETCH_WORKERS: "2"
        run: |
          python - <<'PY'
          from datetime import datetime, timezone

          from live_market_snapshot_provider import LiveClobMarketSnapshotProvider

          provider = LiveClobMarketSnapshotProvider(
              max_age_seconds=30.0,
              market_limit=2,
              timeout_seconds=15.0,
          )
          snapshots = provider.load(now=datetime.now(timezone.utc))
          if not snapshots:
              raise SystemExit(
                  "Public Gamma/CLOB smoke check found no fresh, usable binary market books."
              )

          for row in snapshots:
              if not row.get("market_id") or not row.get("yes_token_id") or not row.get("no_token_id"):
                  raise SystemExit("Live market snapshot is missing market/outcome identifiers.")
              if row.get("research_only") is not True or row.get("execution") != "none":
                  raise SystemExit("Public market snapshot escaped its research-only contract.")
              for side in ("yes", "no"):
                  book = row.get(f"{side}_book")
                  if not isinstance(book, dict) or book.get("book_usable") is not True:
                      raise SystemExit(f"{side.upper()} live CLOB book is not usable.")
                  if not book.get("bids_top5") or not book.get("asks_top5"):
                      raise SystemExit(f"{side.upper()} live CLOB book is not two-sided.")

          print(
              f"OK: live Gamma/CLOB returned {len(snapshots)} fresh binary market snapshot(s); "
              "both outcomes have usable two-sided books."
          )
          print("Read-only public endpoints only; no credentials, wallet, or orders used.")
          PY
