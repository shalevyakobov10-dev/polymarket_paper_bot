name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile app.py paper_trading.py news_monitor.py market_data.py market_quality.py market_stream.py global_news.py risk_manager.py resilience.py backtest.py forecast_evaluation.py resolution_tracker.py research_features.py independent_model_evaluation.py learning_journal.py model_governance.py publisher_identity.py paper_fees.py execution_readiness.py account_risk_policy.py live_order_preflight.py order_lifecycle.py order_journal.py user_order_stream.py order_staging.py service_supervisor.py supervisor_status.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build Docker image
        run: docker build -t polymarket-paper-bot:ci .
      - name: Smoke-test container HTTP endpoints
        run: |
          set -euo pipefail
          docker run -d --rm --name polymarket-paper-bot-smoke \
            -e DATA_DIR=/tmp/polymarket-smoke-data \
            -p 18080:8080 polymarket-paper-bot:ci
          cleanup() { docker stop polymarket-paper-bot-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          ready=0
          for _ in $(seq 1 20); do
            if curl --silent --show-error --fail http://127.0.0.1:18080/news > /tmp/paper-news.json; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" -eq 1
          health_code=$(curl --silent --show-error --output /tmp/paper-health.json --write-out "%{http_code}" http://127.0.0.1:18080/health)
          test "$health_code" = "200" -o "$health_code" = "503"
          curl --silent --show-error --fail http://127.0.0.1:18080/status > /tmp/paper-status.json
          curl --silent --show-error --fail http://127.0.0.1:18080/paper > /tmp/paper-portfolio.json
          curl --silent --show-error --fail http://127.0.0.1:18080/matches > /tmp/paper-matches.json
          curl --silent --show-error --fail http://127.0.0.1:18080/market-stream > /tmp/paper-market-stream.json
          curl --silent --show-error --fail http://127.0.0.1:18080/resolutions > /tmp/paper-resolutions.json
          curl --silent --show-error --fail http://127.0.0.1:18080/forecast-evaluation > /tmp/paper-forecast-evaluation.json
          curl --silent --show-error --fail http://127.0.0.1:18080/research-features > /tmp/paper-research-features.json
          curl --silent --show-error --fail http://127.0.0.1:18080/independent-model-evaluation > /tmp/paper-independent-model-evaluation.json
          curl --silent --show-error --fail http://127.0.0.1:18080/model-forecasts > /tmp/paper-model-forecasts.json
          curl --silent --show-error --fail http://127.0.0.1:18080/learning > /tmp/paper-learning.json
          curl --silent --show-error --fail http://127.0.0.1:18080/execution-readiness > /tmp/paper-execution-readiness.json
          curl --silent --show-error --fail http://127.0.0.1:18080/service-supervisor > /tmp/paper-service-supervisor.json
          python - <<'PY'
          import json
          from pathlib import Path

          news = json.loads(Path("/tmp/paper-news.json").read_text())
          health = json.loads(Path("/tmp/paper-health.json").read_text())
          status = json.loads(Path("/tmp/paper-status.json").read_text())
          paper = json.loads(Path("/tmp/paper-portfolio.json").read_text())
          matches = json.loads(Path("/tmp/paper-matches.json").read_text())
          market_stream = json.loads(Path("/tmp/paper-market-stream.json").read_text())
          resolutions = json.loads(Path("/tmp/paper-resolutions.json").read_text())
          forecast = json.loads(Path("/tmp/paper-forecast-evaluation.json").read_text())
          features = json.loads(Path("/tmp/paper-research-features.json").read_text())
          model_evaluation = json.loads(Path("/tmp/paper-independent-model-evaluation.json").read_text())
          model_forecasts = json.loads(Path("/tmp/paper-model-forecasts.json").read_text())
          learning = json.loads(Path("/tmp/paper-learning.json").read_text())
          execution_readiness = json.loads(Path("/tmp/paper-execution-readiness.json").read_text())
          supervisor = json.loads(Path("/tmp/paper-service-supervisor.json").read_text())
          assert "items" in news and "feeds_configured" in news, "news endpoint schema mismatch"
          assert health.get("mode") == "paper_only", "health endpoint must remain paper-only"
          assert health.get("status") in {"healthy", "degraded", "unhealthy"}, "health endpoint status schema mismatch"
          assert isinstance(health.get("components"), dict), "health endpoint component details missing"
          assert status.get("mode") == "paper_only", "service must stay paper-only"
          assert isinstance(status.get("news"), dict), "status must include news health"
          assert isinstance(paper.get("metrics"), dict), "paper endpoint metrics missing"
          assert matches.get("research_only") is True and matches.get("execution") == "none", "news match endpoint must remain research-only"
          assert isinstance(matches.get("items"), list), "match candidates must be a list"
          assert market_stream.get("enabled") is True, "public market stream health endpoint missing"
          assert market_stream.get("worker_running") is True, "market stream worker did not start"
          assert resolutions.get("research_only") is True and resolutions.get("execution") == "none", "resolution collector must remain research-only"
          assert forecast.get("mode") == "RESOLVED_MARKET_FORECAST_EVALUATION", "forecast evaluation endpoint mode mismatch"
          assert isinstance(forecast.get("metrics"), dict), "forecast evaluation metrics missing"
          assert features.get("mode") == "RESEARCH_FEATURES_V1", "research features endpoint mode mismatch"
          assert isinstance(features.get("summary"), dict), "research features summary missing"
          assert features.get("research_only") is True and features.get("execution") == "none", "research features must remain non-executable"
          assert model_evaluation.get("mode") == "INDEPENDENT_FEATURE_MODEL_EVALUATION_V1", "independent model endpoint mode mismatch"
          assert model_evaluation.get("status") == "insufficient_data", "empty smoke-test dataset must not fit a model"
          assert model_evaluation.get("research_only") is True and model_evaluation.get("execution") == "none", "model evaluation must remain research-only"
          assert model_forecasts.get("mode") == "CURRENT_FEATURE_MODEL_FORECASTS_V1", "current model forecasts endpoint mode mismatch"
          assert model_forecasts.get("status") == "insufficient_data", "empty smoke-test dataset must not fit a model"
          assert model_forecasts.get("decision") == "NO_ACTION_RESEARCH_ONLY", "current model forecasts must not issue actions"
          assert model_forecasts.get("live_execution_enabled") is False, "live execution must stay disabled"
          assert learning.get("mode") == "REALIZED_FORECAST_FEEDBACK_V1", "learning endpoint mode mismatch"
          assert learning.get("live_execution_enabled") is False, "learning feedback must remain non-executable"
          assert learning.get("automatic_parameter_tuning") is False, "parameter tuning must remain gated"
          assert execution_readiness.get("mode") == "paper_only", "execution-readiness must remain paper-only"
          assert execution_readiness.get("live_execution_enabled") is False, "live execution must remain disabled"
          assert execution_readiness.get("order_submission_allowed") is False, "live orders must remain blocked"
          assert execution_readiness.get("execution") == "none", "execution-readiness must not submit orders"
          assert supervisor.get("supervised") is True, "process supervisor status must be available in Docker"
          assert supervisor.get("status_fresh") is True, "process supervisor heartbeat must be fresh"
          assert supervisor.get("service_state") in {"starting", "running"}, "supervisor service state must be starting or running"
          assert supervisor.get("monitor_enabled") is False, "account monitor must remain disabled in smoke test"
          assert supervisor.get("monitor_state") == "disabled", "disabled monitor state mismatch"
          assert supervisor.get("order_submission_allowed") is False, "supervisor status must never enable orders"
          assert supervisor.get("execution") == "none", "supervisor status must remain read-only"
          assert "POLYMARKET_PRIVATE_KEY" not in supervisor, "supervisor status must not expose secrets"
          print("Container smoke check passed: research, learning, execution-readiness, and sanitized supervisor status endpoints returned valid JSON.")
          PY
