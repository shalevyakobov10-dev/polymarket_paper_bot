name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile
        run: python -m py_compile app.py paper_trading.py backtest.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build Docker image
        run: docker build -t polymarket-paper-bot:ci .
